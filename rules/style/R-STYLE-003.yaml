rule_id: R-STYLE-003
version: 1
category: STYLE
title: 单品风格不同源
severity: soft
scope: outfit
condition:
  all:
  - field: outfit.garment_count
    op: gte
    value: 3
  # 同源度的宽口径：词面 jaccard 与「风格家族」jaccard 取大者（docs/10 F-17）。
  # 只认字符串会把同义词判成冲突（日系少女 vs 甜美 vs 少女感）。
  - field: outfit.style.same_source_jaccard
    op: lt
    value: 0.2
  # F-09 豁免：高正式度（正装/礼服）是制服式组合，同源由品类保证，jaccard 会系统性误判
  - {field: outfit.formality, op: lt, value: 0.85}
effect: penalty
score_impact:
  dimension: D2
  delta: -4.0
explain_template: '{outfit.garment_count} 件单品的风格同源度最低只有 {outfit.style_tag_jaccard_min}，不在一个基调上。'
evidence_fields:
- outfit.garment_count
- outfit.style_tag_jaccard_min
- outfit.style.same_source_jaccard
- ctx.top_style_cn
- outfit.formality
source: domain_expert
status: active
suppresses: []
render_priority: 50
test_cases:
  positive:
  - case_id: pos-01
    fixture: R-STYLE-003
    expect: hit
  negative:
  - case_id: neg-01
    fixture: R-STYLE-003
    expect: miss
  - case_id: neg-02
    fixture: R-STYLE-003
    expect: miss
suggestion_template: 先定一个主基调 {ctx.top_style_cn}，把偏离基调的单品换成同风格款。
