rule_id: R-STYLE-002
version: 1
category: STYLE
title: 与画像无交集
severity: soft
scope: outfit
condition:
  # 词面完全无交集不算数：还要「风格家族」也无交集（docs/10 F-17）。
  # Y2K vs 千禧辣妹 vs 日系少女 常被判成 0 重叠，但它们是同一路风格。
  all:
  - field: outfit.style.top_overlap_count
    op: eq
    value: 0
  - field: outfit.style.family_overlap_count
    op: eq
    value: 0
effect: penalty
score_impact:
  dimension: D2
  delta: -5.0
explain_template: 这套搭配的风格（{outfit.style_tags|list}）与你常穿的 {profile.top_styles|list} 完全没有交集。
evidence_fields:
- outfit.style.top_overlap_count
- outfit.style.family_overlap_count
- outfit.style_tags
- profile.top_styles
- ctx.top_style_cn
source: domain_expert
status: active
suppresses:
- R-STYLE-005
render_priority: 50
test_cases:
  positive:
  - case_id: pos-01
    fixture: R-STYLE-002
    expect: hit
  negative:
  - case_id: neg-01
    fixture: R-STYLE-002
    expect: miss
  - case_id: neg-02
    fixture: R-STYLE-002
    expect: miss
suggestion_template: 保留一件主单品，把其余单品换成 {ctx.top_style_cn} 风格，向你的常穿方向靠拢。
