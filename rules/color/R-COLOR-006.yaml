rule_id: R-COLOR-006
version: 1
category: COLOR
title: 明度断层过大
severity: soft
scope: cross_garment
condition:
  all:
  - {field: garment.top.color.lightness, op: abs_diff_gt, other_field: garment.bottom.color.lightness, value: 0.65}
  # F-09 豁免：上半身与下半身同为中性色（黑白灰）时，高明度对比是经典剪裁手法，不是缺陷
  - not:
      any:
      - all:
        - {field: garment.top.color.is_neutral, op: is_true}
        - {field: garment.bottom.color.is_neutral, op: is_true}
      # F-09 豁免：正式场合的黑白高对比是正装标准配置
      - {field: outfit.occasion, op: in, value: [formal]}
effect: penalty
score_impact:
  dimension: D1
  delta: -2.0
explain_template: 上装与下装明度相差 {outfit.colors.top_bottom_lightness_diff}，上下半身的色调被生硬切断。
evidence_fields:
- outfit.colors.top_bottom_lightness_diff
- garment.top.color.lightness
- garment.bottom.color.lightness
- garment.top.color.is_neutral
- garment.bottom.color.is_neutral
- outfit.occasion
source: domain_expert
status: active
suppresses: []
render_priority: 50
test_cases:
  positive:
  - case_id: pos-01
    fixture: R-COLOR-006
    expect: hit
  negative:
  - case_id: neg-01
    fixture: R-COLOR-006
    expect: miss
  - case_id: neg-02
    fixture: R-COLOR-006
    expect: miss
suggestion_template: 加一条中等明度的腰带或包做桥接，或把下装换成中灰、藏青这类中间明度。
