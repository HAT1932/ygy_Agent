# 搭配库（双塔召回中「搭配塔」的候选池）
#
# 这是「双塔召回」的被召回侧：用户塔（画像向量）× 搭配塔（本库各条目的向量）。
# 刻意与用户的参考穿搭分开 —— 否则召回等于把输入原样吐回来，失去意义。
#
# 字段说明：Color 只需给 hex（hue/saturation/lightness 由代码确定性推导）；
# family 用于色彩规则（cool/warm/neutral/earth/vivid/metal）。
# formality 用 1–5 整数（1=家居 3=休闲 4=通勤 5=正式），代码按 (f-1)/4 映射到 0–1。

