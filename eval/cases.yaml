  - case_id: c19
    user_id: p05
    scenario: home
    style_ref: french
    difficulty: bad
    profile_refs: ["demo/casual-2", "demo/season-1", "demo/clash-1"]
    outfit_refs: ["demo/accessory-2"]
    occasion: home
    season: winter
    annotators: [50, 52, 54]
    human_verdict: neutral
    human_note: 高跟鞋+五件配饰在家穿，华丽得没有场合。

  - case_id: c20
    user_id: p05
    scenario: home
    style_ref: american_vintage
    difficulty: boundary
    profile_refs: ["demo/casual-2", "demo/season-1", "demo/clash-1"]
    outfit_refs: ["demo/casual-2"]
    occasion: home
    season: autumn
    annotators: [72, 74, 76]
    human_verdict: suitable
    human_note: 印花T+牛仔居家很自然，帽子室内稍多余。
